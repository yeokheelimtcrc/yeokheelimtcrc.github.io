<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <!-- 关键：让页面宽度随设备屏幕缩放 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>手机端适配示例</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
      background-color: #f9f9f9;
      color: #333;
    }
    header {
      background: #800000;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    section {
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
      background: #fff;
      border-radius: 8px;
      box-sizing: border-box;
    }
    h2 {
      color: #800000;
      border-bottom: 2px solid #ddd;
      padding-bottom: 5px;
    }
    img {
      max-width: 100%; /* 图片自适应屏幕宽度 */
      height: auto;
      border-radius: 6px;
    }
    footer {
      text-align: center;
      padding: 15px;
      background: #eee;
      margin-top: 30px;
      font-size: 0.9em;
    }

    /* 手机端优化 */
    @media (max-width: 600px) {
      header {
        padding: 15px;
      }
      h1 {
        font-size: 1.4em;
        line-height: 1.3;
      }
      section {
        margin: 10px;
        padding: 15px;
      }
      h2 {
        font-size: 1.1em;
      }
      p, li {
        font-size: 0.95em;
      }
    }
  </style>
</head>
<body>

<header>
  <h1>2026年7月 · 南华文化节</h1>
</header>

<section>
  <h2>前言</h2>
  <p>这是一个示例段落，展示如何在手机端自适应显示。</p>
  <img src="https://via.placeholder.com/600x300" alt="示例图片">
</section>

<footer>
  <p>© 2026 南华文化节展览 · 新加坡</p>
</footer>

</body>
</html>
